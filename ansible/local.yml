- name: setup zeus
  hosts: localhost
  connection: local
  vars_files:
    - vars/all.yml
    - vars/vault.yml
  become: true

  roles:
    - network
    - ssh
    - packages
    - docker
    - caddy
    - pihole
    - prometheus
    - node-exporter
    - cadvisor
    - grafana
    - boinc
    - tailscale
