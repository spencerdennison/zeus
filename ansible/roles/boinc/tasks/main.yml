- name: start container
  community.docker.docker_container:
    name: boinc
    image: lscr.io/linuxserver/boinc:latest
    ports:
      - '2005:8080'
      - '8181:8181'
    env:
      PUID: '1000'
      PGUID: '1000'
    shm_size: '1GB'
    volumes:
      - '/srv/docker/boinc:/config'
    networks:
      - name: '{{ network }}'
    restart_policy: 'unless-stopped'
    state: started
