- name: set static ip
  ansible.builtin.template:
    src: interface.j2
    dest: /etc/network/interfaces
    owner: root
    group: root
    mode: '0644'
  notify: restart networking

- name: install resolvconf
  ansible.builtin.apt:
    name: resolvconf
    state: present

- name: add router nameserver
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf 
    owner: root
    group: root
    mode: '0644'
  notify: restart resolvconf
