- name: start container
  community.docker.docker_container:
    name: forever-world
    image: itzg/minecraft-server:latest
    recreate: true
    restart: true
    ports:
      - '25565:25565'
    env:
      EULA: "TRUE"
      DIFFICULTY: "hard"
      ENABLE_WHITELIST: "true"
      WHITELIST: |
        stewbagg
      SIMULATION_DISTANCE: "32"
      VIEW_DISTANCE: "32"
    volumes:
      - '/srv/docker/forever-world/data:/data'
    networks:
      - name: '{{ network }}'
    state: started
