global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          hostname: 'zeus'
      - targets: ["192.168.1.3:9100"]
        labels:
          hostname: 'ares'

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          hostname: 'zeus'
      - targets: ["192.168.1.3:8080"]
        labels:
          hostname: 'ares'

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          hostname: 'zeus'
