- name: Home
  head-widgets:
    - type: markets
      markets:
        - symbol: ES=F
          chart-link: https://www.tradingview.com/chart/?symbol=CME_MINI%3AES1%21
          symbol-link: https://www.tradingview.com/symbols/CME_MINI-ES1!/
          name: SP500 Futures
        - symbol: ^TNX
          chart-link: https://www.tradingview.com/chart/?symbol=TVC%3ATNX
          symbol-link: https://www.tradingview.com/symbols/TVC-TNX/
          name: 10-Yr Bond
        - symbol: ^VIX
          chart-link: https://www.tradingview.com/chart/?symbol=TVC%3AVIX
          symbol-link: https://www.tradingview.com/symbols/TVC-VIX/
          name: Volatility
        - symbol: GC=F
          chart-link: https://www.tradingview.com/chart/?symbol=OANDA%3AXAUUSD
          symbol-link: https://www.tradingview.com/symbols/XAUUSD/?exchange=OANDA
          name: Gold
        - symbol: BTC-USD
          chart-link: https://www.tradingview.com/chart/?symbol=CRYPTO%3ABTCUSD
          symbol-link: https://www.tradingview.com/symbols/BTCUSD/?exchange=CRYPTO
          name: Bitcoin
  hide-desktop-navigation: true
  columns:
    - size: small
      widgets:
        - type: dns-stats
          service: pihole-v6
          url: https://dns.spencerdennison.com
          password: ${WEBSERVER_API_PASSWORD}

        - type: bookmarks
          groups:
            - links:
              - title: BOINC Stats
              - url: https://www.boincstats.com/stats/-5/user/detail/257097893317/projectList
              - title: Cloudflare
                url: https://dash.cloudflare.com/5b49d8a3ec85f2b892e832a10624bd88/home
              - title: Email
                url: https://mail.proton.me/u/0/inbox
              - title: Github
                url: https://github.com/spencerdennison
              - title: WGU
                url: https://my.wgu.edu
              - title: Torn
                url: https://www.torn.com/index.php
              - title: YouTube
                url: https://www.youtube.com
              - title: Tailscale
                url: https://console.tailscale.com/admin/machines
              - title: Indeed
                url: https://www.indeed.com
              - title: Docs
                url: https://docs.google.com
              - title: LinkedIn
                url: https://www.linkedin.com

    - size: full
      widgets:
        - type: docker-containers
          containers:
            caddy:
              name: Caddy
              description: Proxy
              icon: sh:caddy
            glance:
              name: Glance
              description: Dashboard
              icon: sh:glance
              url: https://dashboard.spencerdennison.com
            navidrome:
              name: Navidrome
              description: Music
              icon: sh:navidrome
              url: https://music.spencerdennison.com
            pihole:
              name: Pi-hole
              description: DNS
              icon: sh:pi-hole
              url: https://dns.spencerdennison.com
            qbittorrent:
              name: qBittorrent
              description: Torrent
              icon: sh:qbittorrent
              url: https://torrent.spencerdennison.com
            boinc:
              name: BOINC
              description: Volunteer
              icon: di:boinc.webp
              url: https://volunteer.spencerdennison.com

        - type: rss
          title: News
          cache: 1h
          style: horizontal-cards
          feeds:
            - url: https://hnrss.org/newest
              title: Hacker News
            - url: https://www.phoronix.com/rss.php
              title: Phoronix
            - url: https://selfh.st/rss/
              title: selfh.st
            - url: https://www.bleepingcomputer.com/feed/
              title: BleepingComputer
            - url: https://feeds.bbci.co.uk/news/world/rss.xml
              title: BBC World
            - url: https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml
              title: BBC US
            - url: https://feeds.bbci.co.uk/news/politics/rss.xml
              title: BBC Politics
            - url: https://feeds.bbci.co.uk/news/science_and_environment/rss.xml
              title: BBC Science

    - size: small
      widgets:
        - type: weather
          title-url: https://radar.weather.gov/
          units: imperial
          hour-format: 12h
          location: ${LOCATION}

        - type: server-stats
          servers:
            - type: local
              cpu-temp-sensor: k10temp_tctl
              mountpoints:
                '/host/var':
                  name: /var
                '/host':
                  name: /
                '/host/srv':
                  name: /srv
                '/host/boot/efi':
                  hide: true
              name: zeus
            - type: remote
              name: ares
              url: http://192.168.1.3:27973
              token: ${AGENT_TOKEN}
